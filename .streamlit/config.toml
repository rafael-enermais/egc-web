# Tema: troca o vermelho padrao do Streamlit (botoes primarios, selecoes) pelo
# azul do dashboard da Visao do Grupo.
# ATENCAO: NAO usar [theme] com so' primaryColor -- isso fixa o tema CLARO e
# ignora a preferencia escuro/claro do navegador (bug da v0.42.0: app ficou
# branco). Por isso as duas secoes abaixo: claro e escuro seguem automaticos.
[theme.light]
primaryColor = "#2a78d6"

[theme.dark]
primaryColor = "#3987e5"
